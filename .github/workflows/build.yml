name: Build YuzGram APK

on:
  workflow_dispatch:
  push:
    branches: [ main, yuzgram-ci ]
  pull_request:

env:
  NDK_VERSION: 21.4.7075529

jobs:
  build:
    # Telegram-FOSS native + gradle build needs a full Linux toolchain.
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install host tools (yasm, autoconf, cmake, ninja, patch)
        run: |
          sudo apt-get update
          sudo apt-get install -y yasm autoconf libtool cmake ninja-build patch file

      - name: Set up JDK 11 (AGP 7.0.3)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Set up Go (boringssl codegen)
        uses: actions/setup-go@v5
        with:
          go-version: '1.20'

      - name: Set up isolated Android SDK (clean, AGP 7.0.3 compatible)
        run: |
          set -uo pipefail
          SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$SDK_ROOT"
          # Reuse the runner's preinstalled cmdline-tools (JDK-11 compatible) but target a CLEAN sdk_root,
          # so AGP 7.0.3 never scans the preinstalled API-34/35/36/37 preview platforms (parse crash).
          SDKM="$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          [ -z "$SDKM" ] && SDKM="$(command -v sdkmanager)"
          echo "Using sdkmanager: $SDKM"
          yes | "$SDKM" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
          "$SDKM" --sdk_root="$SDK_ROOT" --install \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.0" \
            "build-tools;30.0.3" \
            "ndk;${NDK_VERSION}"
          # cmake;3.10.2.4988405 is often delisted -> install an available one and align build.gradle
          "$SDKM" --sdk_root="$SDK_ROOT" --install "cmake;3.18.1" || "$SDKM" --sdk_root="$SDK_ROOT" --install "cmake;3.22.1"
          CMAKE_VER="$(ls "$SDK_ROOT/cmake" | sort -V | tail -1)"
          echo "Installed cmake: $CMAKE_VER"
          # Align AGP's expected cmake with the version we actually installed
          sed -i "s/version '3.10.2'/version '${CMAKE_VER}'/" TMessagesProj/build.gradle
          grep -n "version '3" TMessagesProj/build.gradle || true
          # dx parity
          if [ -f "$SDK_ROOT/build-tools/30.0.3/dx" ] && [ ! -f "$SDK_ROOT/build-tools/33.0.0/dx" ]; then
            cp "$SDK_ROOT/build-tools/30.0.3/dx" "$SDK_ROOT/build-tools/33.0.0/dx"
            cp "$SDK_ROOT/build-tools/30.0.3/lib/dx.jar" "$SDK_ROOT/build-tools/33.0.0/lib/dx.jar"
          fi
          # Fail fast if mandatory pieces are missing
          [ -d "$SDK_ROOT/ndk/${NDK_VERSION}" ] || { echo "NDK missing"; exit 1; }
          [ -d "$SDK_ROOT/platforms/android-33" ] || { echo "platform android-33 missing"; exit 1; }
          # Point AGP/gradle at this clean SDK only
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          printf 'sdk.dir=%s\n' "$SDK_ROOT" > local.properties
          echo "=== platforms ==="; ls "$SDK_ROOT/platforms"
          echo "=== cmake ==="; ls "$SDK_ROOT/cmake"
          echo "=== ndk ==="; ls "$SDK_ROOT/ndk"

      - name: Restrict ABIs to arm64-v8a + armeabi-v7a (match native libs)
        run: |
          # App module: drop x86/x86_64 from packaging abiFilters
          sed -i 's/, "x86", "x86_64"//g' TMessagesProj_App/build.gradle
          # Library module: restrict CMake/externalNativeBuild to arm, else ninja wants x86 .a we never built
          sed -i '/^        multiDexEnabled true$/a\        ndk { abiFilters "armeabi-v7a", "arm64-v8a" }' TMessagesProj/build.gradle
          echo "=== App abiFilters ==="; grep -n "abiFilters" TMessagesProj_App/build.gradle || true
          echo "=== Lib ndk ==="; grep -n "abiFilters" TMessagesProj/build.gradle || true

      - name: Build native libraries (ffmpeg, libvpx, boringssl)
        working-directory: TMessagesProj/jni
        run: |
          export NDK="$ANDROID_HOME/ndk/${NDK_VERSION}"
          export NINJA_PATH="$(command -v ninja)"
          export COMPILATION_PROC_COUNT="$(nproc)"
          echo "NDK=$NDK"; echo "NINJA=$NINJA_PATH"
          ./build_libvpx_clang.sh arm64 arm
          ./build_ffmpeg_clang.sh arm64 arm
          ./patch_ffmpeg.sh
          ./patch_boringssl.sh
          ./build_boringssl.sh arm64 arm
          echo "=== produced static libs ==="
          find ffmpeg/build libvpx/build boringssl/build -name '*.a' 2>/dev/null | sort

      - name: Prepare YuzGram release keystore (from secrets)
        env:
          KS_B64: ${{ secrets.YUZGRAM_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.YUZGRAM_STORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.YUZGRAM_KEY_ALIAS }}
          KS_KPASS: ${{ secrets.YUZGRAM_KEY_PASSWORD }}
        run: |
          # Expose the keystore to gradle as *project* properties via ORG_GRADLE_PROJECT_* env vars.
          # TMessagesProj_App/build.gradle only wires signingConfig when YUZGRAM_STORE_FILE is present,
          # so a missing secret cleanly produces an unsigned build instead of failing.
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/yuzgram-release.keystore"
            {
              echo "ORG_GRADLE_PROJECT_YUZGRAM_STORE_FILE=$RUNNER_TEMP/yuzgram-release.keystore"
              echo "ORG_GRADLE_PROJECT_YUZGRAM_STORE_PASSWORD=$KS_PASS"
              echo "ORG_GRADLE_PROJECT_YUZGRAM_KEY_ALIAS=$KS_ALIAS"
              echo "ORG_GRADLE_PROJECT_YUZGRAM_KEY_PASSWORD=$KS_KPASS"
            } >> "$GITHUB_ENV"
            echo "YuzGram signing ENABLED"
          else
            echo "YuzGram signing DISABLED (unsigned APK)"
          fi

      - name: Build APK (:TMessagesProj_App:assembleAfatRelease)
        run: ./gradlew --no-daemon :TMessagesProj_App:assembleAfatRelease

      - name: Collect APKs
        run: |
          mkdir -p /tmp/artifacts
          find TMessagesProj_App/build/outputs/apk -name '*.apk' -exec cp -v {} /tmp/artifacts/ \;
          ls -la /tmp/artifacts

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: YuzGram-APK
          path: /tmp/artifacts/*.apk
          if-no-files-found: error
          retention-days: 30
