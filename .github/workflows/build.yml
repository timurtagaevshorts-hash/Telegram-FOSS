name: Build YuzGram APK

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'APK variant to build'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
      clean_cache:
        description: "Gradle build cache'ni chetlatish (toza kompilyatsiya)"
        required: true
        default: 'no'
        type: choice
        options:
          - 'no'
          - 'yes'
  push:
    branches: [ main, yuzgram-ci ]
  pull_request:

env:
  NDK_VERSION: 21.4.7075529

# Bir branch'da yangi push kelganda eski (allaqachon keraksiz) run avtomatik
# bekor qilinadi — CI daqiqlari va runner o'rinlari bo'shaydi.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Telegram-FOSS native + gradle build needs a full Linux toolchain.
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install host tools (yasm, autoconf, cmake, ninja, patch)
        run: |
          sudo apt-get update
          sudo apt-get install -y yasm autoconf libtool cmake ninja-build patch file

      - name: Set up JDK 11 (AGP 7.0.3)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Set up Go (boringssl codegen)
        uses: actions/setup-go@v5
        with:
          go-version: '1.20'

      - name: Set up isolated Android SDK (clean, AGP 7.0.3 compatible)
        run: |
          set -uo pipefail
          SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$SDK_ROOT"
          # Reuse the runner's preinstalled cmdline-tools (JDK-11 compatible) but target a CLEAN sdk_root,
          # so AGP 7.0.3 never scans the preinstalled API-34/35/36/37 preview platforms (parse crash).
          SDKM="$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          [ -z "$SDKM" ] && SDKM="$(command -v sdkmanager)"
          echo "Using sdkmanager: $SDKM"
          yes | "$SDKM" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
          "$SDKM" --sdk_root="$SDK_ROOT" --install \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.0" \
            "build-tools;30.0.3" \
            "ndk;${NDK_VERSION}"
          # cmake;3.10.2.4988405 is often delisted -> install an available one and align build.gradle
          "$SDKM" --sdk_root="$SDK_ROOT" --install "cmake;3.18.1" || "$SDKM" --sdk_root="$SDK_ROOT" --install "cmake;3.22.1"
          CMAKE_VER="$(ls "$SDK_ROOT/cmake" | sort -V | tail -1)"
          echo "Installed cmake: $CMAKE_VER"
          # Align AGP's expected cmake with the version we actually installed
          sed -i "s/version '3.10.2'/version '${CMAKE_VER}'/" TMessagesProj/build.gradle
          grep -n "version '3" TMessagesProj/build.gradle || true
          # dx parity
          if [ -f "$SDK_ROOT/build-tools/30.0.3/dx" ] && [ ! -f "$SDK_ROOT/build-tools/33.0.0/dx" ]; then
            cp "$SDK_ROOT/build-tools/30.0.3/dx" "$SDK_ROOT/build-tools/33.0.0/dx"
            cp "$SDK_ROOT/build-tools/30.0.3/lib/dx.jar" "$SDK_ROOT/build-tools/33.0.0/lib/dx.jar"
          fi
          # Fail fast if mandatory pieces are missing
          [ -d "$SDK_ROOT/ndk/${NDK_VERSION}" ] || { echo "NDK missing"; exit 1; }
          [ -d "$SDK_ROOT/platforms/android-33" ] || { echo "platform android-33 missing"; exit 1; }
          # Point AGP/gradle at this clean SDK only
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          printf 'sdk.dir=%s\n' "$SDK_ROOT" > local.properties
          echo "=== platforms ==="; ls "$SDK_ROOT/platforms"
          echo "=== cmake ==="; ls "$SDK_ROOT/cmake"
          echo "=== ndk ==="; ls "$SDK_ROOT/ndk"

      # VARIANT + ABI: keyni va qaysi ABI'lar compile qilinishini shu yerda
      # hal qilamiz — chunki CMake cache kaliti ABI ro'yxatini ham o'z ichiga
      # olishi kerak (debug = bitta ABI, release = ikkalasi).
      - name: Resolve build variant and ABIs
        run: |
          # Debug = tez iteratsiya (R8 yo'q). Release = yakuniy imzolangan APK.
          # push/PR doim debug; workflow_dispatch tanlangan variant'ni hurmat qiladi.
          VAR="${{ github.event.inputs.variant }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "$VAR" = "release" ]; then
            TASK=:TMessagesProj_App:bundleAfatRelease
            LABEL=release
            FILTERS='"armeabi-v7a", "arm64-v8a"'
            ABIS=arm64-arm
          else
            TASK=:TMessagesProj_App:assembleAfatDebug
            LABEL=debug
            FILTERS='"arm64-v8a"'
            ABIS=arm64
          fi
          {
            echo "GRADLE_TASK=$TASK"
            echo "APK_LABEL=$LABEL"
            echo "YUZ_ABI_FILTERS=$FILTERS"
            echo "YUZ_ABIS=$ABIS"
          } >> "$GITHUB_ENV"
          echo "Building $TASK (label: $LABEL, abis: $ABIS)"
          # Gradle build cache: o'zgarmagan tasklarning output'i qayta
          # ishlanmaydi. clean_cache=yes bo'lsa — butunlay chetlatiladi.
          if [ "${{ github.event.inputs.clean_cache }}" = "yes" ]; then
            echo "GRADLE_EXTRA=" >> "$GITHUB_ENV"
            echo "gradle build cache BYPASSED"
          else
            echo "GRADLE_EXTRA=--build-cache" >> "$GITHUB_ENV"
            echo "gradle build cache ENABLED"
          fi
      - name: Restrict ABIs (debug=arm64 only, release=arm64+arm)
        run: |
          # App module: drop x86/x86_64 from packaging abiFilters
          sed -i 's/, "x86", "x86_64"//g' TMessagesProj_App/build.gradle
          # Library module: restrict CMake/externalNativeBuild, else ninja wants .a we never built
          sed -i "/^        multiDexEnabled true$/a\\        ndk { abiFilters $YUZ_ABI_FILTERS }" TMessagesProj/build.gradle
          echo "=== App abiFilters ==="; grep -n "abiFilters" TMessagesProj_App/build.gradle || true
          echo "=== Lib ndk ==="; grep -n "abiFilters" TMessagesProj/build.gradle || true

      - name: Cache native libraries (ffmpeg, libvpx, boringssl)
        uses: actions/cache@v4
        with:
          path: |
            TMessagesProj/jni/ffmpeg/build
            TMessagesProj/jni/libvpx/build
            TMessagesProj/jni/boringssl/build
          key: native-${{ runner.os }}-ndk${{ env.NDK_VERSION }}-${{ hashFiles('TMessagesProj/jni/build_ffmpeg_clang.sh', 'TMessagesProj/jni/build_libvpx_clang.sh', 'TMessagesProj/jni/build_boringssl.sh', 'TMessagesProj/jni/patch_ffmpeg.sh', 'TMessagesProj/jni/patch_boringssl.sh', 'TMessagesProj/jni/CMakeLists.txt') }}
          restore-keys: |
            native-${{ runner.os }}-ndk${{ env.NDK_VERSION }}-
            native-${{ runner.os }}-

      - name: Build native libraries (ffmpeg, libvpx, boringssl)
        working-directory: TMessagesProj/jni
        run: |
          export NDK="$ANDROID_HOME/ndk/${NDK_VERSION}"
          export NINJA_PATH="$(command -v ninja)"
          export COMPILATION_PROC_COUNT="$(nproc)"
          echo "NDK=$NDK"; echo "NINJA=$NINJA_PATH"
          # Skip the ~25min native build when the cached .a files are already present.
          have() { ls "$1" >/dev/null 2>&1; }
          if have ffmpeg/build/arm64/lib/libavcodec.a && have ffmpeg/build/arm64/lib/libswscale.a \
             && have ffmpeg/build/arm/lib/libavcodec.a \
             && have libvpx/build/arm64/lib/libvpx.a && have libvpx/build/arm/lib/libvpx.a \
             && have boringssl/build/arm64/ssl/libssl.a && have boringssl/build/arm64/crypto/libcrypto.a \
             && have boringssl/build/arm/ssl/libssl.a && have boringssl/build/arm/crypto/libcrypto.a; then
            echo "=== native libs already present (cache hit) -> skipping build ==="
            find ffmpeg/build libvpx/build boringssl/build -name '*.a' 2>/dev/null | sort
            exit 0
          fi
          ./build_libvpx_clang.sh arm64 arm
          ./build_ffmpeg_clang.sh arm64 arm
          ./patch_ffmpeg.sh
          ./patch_boringssl.sh
          ./build_boringssl.sh arm64 arm
          echo "=== produced static libs ==="
          find ffmpeg/build libvpx/build boringssl/build -name '*.a' 2>/dev/null | sort

      # CMake cache kaliti uchun BIZNING jni manbalary (submodule'larsiz) —
      # ffmpeg/libvpx/boringssl alohida .a cache'da, ular bu yerda kerak emas.
      - name: Compute jni source hash
        run: |
          H=$(find TMessagesProj/jni -maxdepth 3 \
                \( -path 'TMessagesProj/jni/ffmpeg' -o -path 'TMessagesProj/jni/libvpx' \
                   -o -path 'TMessagesProj/jni/boringssl' -o -path 'TMessagesProj/jni/libwebp' \
                   -o -name build \) -prune -o \
                -type f \( -name '*.c' -o -name '*.cpp' -o -name '*.cc' -o -name '*.h' \
                           -o -name '*.hpp' -o -name 'CMakeLists.txt' \) -print0 \
                | sort -z | xargs -0 sha1sum | sha1sum | cut -c1-16)
          echo "YUZ_JNI_HASH=$H" >> "$GITHUB_ENV"
          echo "jni source hash = $H"

      # 17 daqiqalik C++ compile (libtmessages.so) — eng katta vaqt yeyuvchi
      # bosqich. Bizning .kt/.java o'zgarishlarida C++ umuman o'zgarmaydi,
      # shuning uchun ninja obyektlarini cache qilamiz: keyingi run'da ninja
      # obyektlarni "tayyor" ko'radi va faqat link qiladi (~1-2 daqiqa).
      - name: Cache CMake objects (libtmessages.so)
        uses: actions/cache@v4
        with:
          path: |
            TMessagesProj/.cxx
            TMessagesProj/build/intermediates/cxx
          key: cxx-${{ runner.os }}-ndk${{ env.NDK_VERSION }}-${{ env.YUZ_ABIS }}-${{ env.YUZ_JNI_HASH }}
          restore-keys: |
            cxx-${{ runner.os }}-ndk${{ env.NDK_VERSION }}-${{ env.YUZ_ABIS }}-

      # Ninja mtime bilan ishlaydi: manbalar ESKI, obyektlar YANGI bo'lsa —
      # "hammasi up-to-date" deb qayta compile qilmaydi. Checkout yangi mtime
      # beradi, shuning uchun jni manbalarini ataylab 2020 yilga qaytaramiz.
      - name: Age jni sources (so cached objects look newer)
        run: |
          find TMessagesProj/jni -maxdepth 3 \
            \( -path 'TMessagesProj/jni/ffmpeg' -o -path 'TMessagesProj/jni/libvpx' \
               -o -path 'TMessagesProj/jni/boringssl' -o -path 'TMessagesProj/jni/libwebp' \) -prune -o \
            -type f -exec touch -d '2020-01-01 00:00:00' {} +
          echo "jni manbalari 2020-01-01 ga o'rnatildi (obyektlar yangiroq ko'rinadi)"

      - name: Cache gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties', 'gradle.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # Gradle BUILD CACHE (~/.gradle/caches/build-cache-1) — kompilyatsiya
      # vaqtini eng ko'p qisqartiradigan narsa: javac/kotlinc/dex tasklari
      # input hash bo'yicha saqlanadi, o'zgarmagan fayllar qayta ishlanmaydi.
      # MUHIM: kalit HAR run'da yangi (${github.run_id}), chunki actions/cache
      # mavjud bir xil kalitni yangilamaydi — aks holda build cache hech
      # qachon o'smas edi. restore-keys eng yangisini oladi.
      - name: Cache gradle build cache
        if: github.event.inputs.clean_cache != 'yes'
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/build-cache-1
          key: buildcache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            buildcache-${{ runner.os }}-

      - name: Prepare YuzGram release keystore (from secrets)
        env:
          KS_B64: ${{ secrets.YUZGRAM_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.YUZGRAM_STORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.YUZGRAM_KEY_ALIAS }}
          KS_KPASS: ${{ secrets.YUZGRAM_KEY_PASSWORD }}
        run: |
          # Expose the keystore to gradle as *project* properties via ORG_GRADLE_PROJECT_* env vars.
          # TMessagesProj_App/build.gradle only wires signingConfig when YUZGRAM_STORE_FILE is present,
          # so a missing secret cleanly produces an unsigned build instead of failing.
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d -i > "$RUNNER_TEMP/yuzgram-release.keystore"
            ls -l "$RUNNER_TEMP/yuzgram-release.keystore"
            {
              echo "ORG_GRADLE_PROJECT_YUZGRAM_STORE_FILE=$RUNNER_TEMP/yuzgram-release.keystore"
              echo "ORG_GRADLE_PROJECT_YUZGRAM_STORE_PASSWORD=$KS_PASS"
              echo "ORG_GRADLE_PROJECT_YUZGRAM_KEY_ALIAS=$KS_ALIAS"
              echo "ORG_GRADLE_PROJECT_YUZGRAM_KEY_PASSWORD=$KS_KPASS"
            } >> "$GITHUB_ENV"
            echo "YuzGram signing ENABLED"
          else
            echo "YuzGram signing DISABLED (unsigned APK)"
          fi

      - name: Build APK
        run: ./gradlew --no-daemon $GRADLE_EXTRA "$GRADLE_TASK"

      - name: Collect artifacts (APK va/ya AAB)
        run: |
          mkdir -p /tmp/artifacts
          find TMessagesProj_App/build/outputs -name '*.apk' -exec cp -v {} /tmp/artifacts/ \; || true
          find TMessagesProj_App/build/outputs -name '*.aab' -exec cp -v {} /tmp/artifacts/ \; || true
          ls -la /tmp/artifacts

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: YuzGram-APK-${{ env.APK_LABEL }}
          path: /tmp/artifacts/*
          if-no-files-found: error
          retention-days: 30
